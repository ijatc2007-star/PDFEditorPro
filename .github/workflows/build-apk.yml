name: Build & Security Scan (Android APK + AAB + Windows EXE)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build & Scan Android APK + Play AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Offline Arabic & English Tesseract OCR Models (tessdata_fast)
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -fsSL -o app/src/main/assets/tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          curl -fsSL -o app/src/main/assets/tessdata/ara.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata
          ls -lh app/src/main/assets/tessdata

      - name: Bundle Complete 87,423-Word ArabEyes Offline EN↔AR Dictionary (gzipped 700KB)
        run: |
          mkdir -p app/src/main/assets/dict
          python3 - << 'PY'
          import gzip, re, urllib.request
          url = "https://raw.githubusercontent.com/usefksa/engAraDictionaryFrom_ArabEyes/master/engAraDictionary.sql"
          raw = urllib.request.urlopen(url, timeout=30).read().decode("utf-8", errors="ignore")
          rx = re.compile(r"\(\d+,\s*'([^']{1,60})',\s*'([^']{1,160})'\)")
          seen = set()
          lines = []
          for ln in raw.splitlines():
              m = rx.search(ln)
              if m:
                  en = m.group(1).strip().replace("\t", " ")
                  ar = m.group(2).strip().replace("\t", " ")
                  k = en.lower()
                  if en and ar and k not in seen:
                      seen.add(k)
                      lines.append(f"{en}\t{ar}\n")
          assert len(lines) > 50000, f"Too few dictionary rows: {len(lines)}"
          with open("app/src/main/assets/dict/arabeyes_en_ar.tsv", "wb") as f:
              f.write("".join(lines).encode("utf-8"))
          print(f"Bundled {len(lines)} ArabEyes EN<->AR dictionary entries (UTF-8 TSV, APK deflate ~880KB).")
          PY
          ls -lh app/src/main/assets/dict

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Decode Optional Play Store Upload Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            echo "KEYSTORE_FILE=$PWD/release-keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Run Android Unit Tests
        run: gradle testDebugUnitTest

      - name: Run Android Security & Lint Scan
        run: gradle lintDebug

      - name: Build Android Debug APK
        run: gradle assembleDebug

      - name: Verify Bundled Offline Dictionary & OCR Assets Inside APK
        run: |
          python3 - <<'PY'
          import zipfile, glob
          apk = glob.glob("app/build/outputs/apk/debug/*.apk")[0]
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              assert "assets/tessdata/ara.traineddata" in names, "Missing Arabic OCR model!"
              assert "assets/tessdata/eng.traineddata" in names, "Missing English OCR model!"
              assert "assets/dict/arabeyes_en_ar.tsv" in names, "Missing bundled ArabEyes dictionary!"
              lines = [ln for ln in z.read("assets/dict/arabeyes_en_ar.tsv").decode("utf-8").splitlines() if "\t" in ln]
              assert len(lines) > 50000, f"Bundled dictionary too small: {len(lines)}"
              print(f"VERIFIED APK ASSETS: ara.traineddata + eng.traineddata + {len(lines):,} EN<->AR dictionary entries!")
          PY

      - name: Build Google Play Release AAB Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFEditorPro-v5.2-IbrahimJaber2026-Android-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Google Play Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFEditorPro-v5.2-IbrahimJaber2026-PlayStore-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload Security Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Security-Lint-Report
          path: app/build/reports/lint-results-debug.html

  build-windows-exe:
    name: Build Windows PC EXE (with Offline AR/EN OCR & 87k Dictionary)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Offline Arabic & English Tesseract OCR Models (tessdata_fast)
        run: |
          New-Item -ItemType Directory -Force -Path desktop-pc/tessdata | Out-Null
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" -OutFile "desktop-pc/tessdata/eng.traineddata"
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata" -OutFile "desktop-pc/tessdata/ara.traineddata"
          Get-ChildItem desktop-pc/tessdata

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bundle Complete 87,423-Word ArabEyes Offline EN↔AR Dictionary
        shell: python
        run: |
          import gzip, os, re, urllib.request
          os.makedirs("desktop-pc/dict", exist_ok=True)
          url = "https://raw.githubusercontent.com/usefksa/engAraDictionaryFrom_ArabEyes/master/engAraDictionary.sql"
          raw = urllib.request.urlopen(url, timeout=30).read().decode("utf-8", errors="ignore")
          rx = re.compile(r"\(\d+,\s*'([^']{1,60})',\s*'([^']{1,160})'\)")
          seen, lines = set(), []
          for ln in raw.splitlines():
              m = rx.search(ln)
              if m:
                  en = m.group(1).strip().replace("\t", " ")
                  ar = m.group(2).strip().replace("\t", " ")
                  k = en.lower()
                  if en and ar and k not in seen:
                      seen.add(k)
                      lines.append(f"{en}\t{ar}\n")
          assert len(lines) > 50000, f"Too few dictionary rows: {len(lines)}"
          with gzip.open("desktop-pc/dict/arabeyes_en_ar.tsv.gz", "wb", compresslevel=9) as f:
              f.write("".join(lines).encode("utf-8"))
          print(f"Bundled {len(lines)} ArabEyes EN<->AR dictionary entries for Windows PC.")

      - name: Install PC Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop-pc/requirements.txt pyinstaller

      - name: Run PC Engine Unit Tests
        run: pytest desktop-pc/test_pc_engine.py -v

      - name: Compile Standalone Windows EXE (Bundled AR/EN OCR + 87k Dictionary)
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "PDFEditorPro-v5.2-PC-IbrahimJaber2026" `
            --paths desktop-pc `
            --add-data "desktop-pc/tessdata;tessdata" `
            --add-data "desktop-pc/dict;dict" `
            --collect-all customtkinter `
            --collect-all arabic_reshaper `
            --collect-all bidi `
            desktop-pc/main.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFEditorPro-v5.2-PC-IbrahimJaber2026-Windows-EXE
          path: dist/PDFEditorPro-v5.2-PC-IbrahimJaber2026.exe
