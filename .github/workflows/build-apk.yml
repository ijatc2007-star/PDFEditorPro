name: Build Android APK & Windows PC EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Run Android Unit Tests
        run: gradle testDebugUnitTest

      - name: Build Android Debug APK
        run: gradle assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFProStudio-IbrahimJaber2026-Android-APK
          path: app/build/outputs/apk/debug/*.apk

  build-windows-exe:
    name: Build Windows PC EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PC Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop-pc/requirements.txt pyinstaller

      - name: Run PC Engine Unit Tests
        run: pytest desktop-pc/test_pc_engine.py -v

      - name: Compile Standalone Windows EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "PDFProStudio-PC-IbrahimJaber2026" `
            --paths desktop-pc `
            --collect-all customtkinter `
            --collect-all arabic_reshaper `
            --collect-all bidi `
            desktop-pc/main.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFProStudio-PC-IbrahimJaber2026-Windows-EXE
          path: dist/PDFProStudio-PC-IbrahimJaber2026.exe
